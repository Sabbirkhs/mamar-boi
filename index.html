<style>
:root{--ink:#0b1b3f;--blue:#1e47b8;--go:#c2963f;--go2:#8f6a22;--bg:#f3f5fa;--card:#fff;--ln:#e1e6f1;--tx:#111b36;--mu:#5b6785;--ok:#168a5b;--rd:#c73b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 'Hind Siliguri',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:'Noto Serif Bengali','Hind Siliguri',serif;color:var(--ink);line-height:1.35;margin:0 0 8px}
h2{font-size:1.25rem}a{color:var(--blue);text-decoration:none}.mu{color:var(--mu)}
:focus-visible{outline:3px solid var(--go);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.top{position:sticky;top:0;z-index:30;background:var(--ink);box-shadow:0 2px 16px #0b1b3f55}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;max-width:1200px;margin:auto}.sp{flex:1}
.lg{height:40px;border-radius:10px;background:#fff;padding:2px;cursor:pointer}
.ava{width:38px;height:38px;border-radius:50%;border:2px solid var(--go);background:#1e47b8;color:#fff;cursor:pointer;padding:0;overflow:hidden;font-size:1rem}.ava img{width:100%;height:100%;object-fit:cover}
.nav{display:none;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:1200px;margin:auto}
.nv{flex:none;border:0;background:transparent;color:#c7d2ee;padding:7px 14px;border-radius:99px;font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}.nv:hover{background:#ffffff18}.nv.on{background:var(--go);color:#fff;font-weight:600}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px #0b1b3f14}
.tabbar button{flex:1;border:0;background:none;font:inherit;font-size:.72rem;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer}.tabbar span{font-size:1.35rem;line-height:1.3}.tabbar .on{color:var(--blue);font-weight:700}
@media(min-width:820px){.nav{display:flex}.tabbar{display:none}body{padding-bottom:0}}
.wrap{max-width:1200px;margin:auto;padding:16px 14px}
.hero{background:var(--ink);line-height:0}.hero img.bn{width:100%;max-height:520px;object-fit:cover;display:block;min-height:150px}
.cta{max-width:760px;margin:-22px auto 0;position:relative;z-index:2;padding:0 14px}.cta .in2{background:#fff;border-radius:18px;box-shadow:0 14px 34px #0b1b3f2e;padding:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.vp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:18px}.vp div{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 14px;font-size:.92rem}.vp b{display:block;color:var(--ink)}
.sh-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px}
.shelf{position:relative}.shelf:after{content:"";position:absolute;left:0;right:0;bottom:8px;height:12px;border-radius:6px;background:linear-gradient(#dfe5f2,#c5cde2);box-shadow:0 10px 16px #0b1b3f26}
.rs{position:relative;z-index:1;display:flex;gap:18px;overflow-x:auto;padding:14px 8px 26px;scroll-snap-type:x proximity;perspective:1000px}.rs .bk{flex:0 0 136px;scroll-snap-align:start}

/* ===== v18 design layer: warm editorial, curved carousel, bento ===== */
:root{--bg:#fbf7ee;--card:#fff;--ink:#101a36;--tx:#1b2238;--mu:#6b6f7e;--ln:#e9e1d0;--go:#b8893a;--go2:#8f6a22;--ol:#59673f;--tan:#c9b08f;--sand:#efe6d4;--teal:#0f6d6a;--am:#e5a23a;--pb0:#dfe6ef;--pb1:#e3e9d6;--pb2:#f5dfd1;--pb3:#e7dff1;--pb4:#dcebf3}
body{background:var(--bg);color:var(--tx)}
h1,h2,h3{font-family:'Noto Serif Bengali','Noto Sans Bengali',serif;color:var(--ink)}
h2{font-size:1.45rem;font-weight:600}
.top{background:rgba(251,247,238,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);box-shadow:none}
.bar{gap:8px}.brand{font-family:'Noto Serif Bengali',serif;font-weight:700;color:var(--ink);cursor:pointer;font-size:1.05rem;white-space:nowrap}
.top .lg{border:1px solid var(--ln);padding:2px}
.ibtn{border:1px solid var(--ln);background:#fff;color:var(--ink);box-shadow:none;backdrop-filter:none}
.ava{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--go)}.ava{background:var(--sand);color:var(--ink)}
.nav{padding-bottom:6px}.nv{color:var(--mu)}.nv:hover{background:var(--sand)}.nv.on{background:var(--ink);color:#fff;font-weight:600}
.btn{border-radius:999px;box-shadow:none;background:var(--ink);padding:11px 20px;letter-spacing:.01em}.btn:active{transform:scale(.98);box-shadow:none}
.btn.go{background:var(--ink)}.btn.ok{background:var(--ol)}.btn.rd{background:#a93b3b}.btn.gh{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}.btn.gh3{background:transparent;border:1.5px solid #ffffff80;color:#fff}.btn.sm{padding:7px 14px}
input,select,textarea{border-radius:14px;background:#fff;border:1.5px solid var(--ln)}input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px #101a3615}
.gl{border-radius:20px;background:#fff;border:1px solid var(--ln);box-shadow:none}
.chip{background:#fff;border-radius:999px}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabbar{background:rgba(251,247,238,.96);border-top:1px solid var(--ln)}.tabbar .on{color:var(--ink)}.tabbar .on:after{background:var(--ink)}
.eyebrow{color:var(--go2);letter-spacing:.2em}.eyebrow.dk{color:var(--go2)}
/* hero: typographic + curved carousel */
.hero5{position:relative;text-align:center;padding:30px 14px 4px;overflow:hidden}.hero5 .sw{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.h5in{position:relative;max-width:760px;margin:0 auto}.h5in h1{margin:6px 0 10px;line-height:1.25}.h1a{display:block;font-weight:400;font-size:clamp(1.45rem,5.2vw,2.5rem)}.h1b{display:block;font-family:'Noto Sans Bengali',sans-serif;font-weight:700;font-size:clamp(1.9rem,7vw,3.4rem);letter-spacing:-.01em}
.h5in p{max-width:540px;margin:0 auto 16px;color:var(--mu)}.hero5 .hb{justify-content:center}
.pill-btn{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:6px 6px 6px 22px;font:inherit;font-weight:600;cursor:pointer}.pill-btn i{width:34px;height:34px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-style:normal}
.pill-out{background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:999px;padding:9px 22px;font:inherit;font-weight:600;cursor:pointer}
.curve{display:flex;justify-content:center;align-items:center;perspective:1100px;padding:30px 0 22px;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.cc{flex:0 0 auto;width:clamp(64px,13.5vw,168px);margin:0 clamp(-8px,-.5vw,-2px);border:0;background:none;padding:0;cursor:pointer;transform:translateY(calc(var(--d)*var(--d)*7px)) rotateY(calc(var(--d)*-17deg)) scale(calc(1.06 - var(--d)*var(--d)*.025));transition:transform .3s}
.cc:hover,.cc:focus-visible{transform:translateY(calc(var(--d)*var(--d)*7px - 6px)) rotateY(calc(var(--d)*-10deg)) scale(1.1)}
.cc img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:14px;box-shadow:0 14px 28px #101a3630;background:#e7dfce}
@media(max-width:600px){.cc.far{display:none}.cc{width:clamp(70px,19vw,120px)}}
.tri{display:grid;grid-template-columns:1fr;gap:0;margin:6px 0 22px;text-align:center}.tri>div{padding:14px 12px;border-top:1px solid var(--ln)}.tri b{display:block;font-family:'Noto Serif Bengali',serif;color:var(--ink)}.tri small{color:var(--mu);line-height:1.6}
@media(min-width:760px){.tri{grid-template-columns:repeat(3,1fr)}.tri>div{border-top:0;border-left:1px solid var(--ln)}.tri>div:first-child{border-left:0}}
/* book cards: pastel panel + flat cover */
.bk .in{padding:10px 4px 0}.bk .in b{font-family:'Noto Serif Bengali',serif;font-weight:600}.pr{color:var(--ink)}
.cvw{background:var(--pb0);border-radius:20px;padding:16px 14px 18px;transition:transform .2s}.cvw.p1{background:var(--pb1)}.cvw.p2{background:var(--pb2)}.cvw.p3{background:var(--pb3)}.cvw.p4{background:var(--pb4)}
.bk:hover .cvw{transform:translateY(-3px)}.cvw .cv{box-shadow:0 10px 20px #101a3633}.bd{background:var(--ink)}.bd.f{background:var(--ol)}

/* topics: pastel tiles */
.topics{gap:12px}.topic{position:relative;border:0;border-radius:22px;min-height:132px;padding:14px;background:var(--pb0)}.topic.t1{background:var(--pb1)}.topic.t2{background:var(--pb2)}.topic.t3{background:var(--pb3)}.topic.t4{background:var(--pb4)}
.topic b{font-size:1.15rem;color:var(--ink);opacity:.5}.topic span{font-family:'Noto Serif Bengali',serif;font-size:1.02rem}.arr{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;background:#ffffffb3;display:grid;place-items:center;font-style:normal;color:var(--ink);font-size:.95rem}
/* bento */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bb{position:relative;overflow:hidden;border:0;border-radius:26px;min-height:190px;padding:18px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:flex;align-items:flex-end}

.bb img{position:absolute;right:14px;bottom:-6px;width:38%;max-width:150px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;box-shadow:0 14px 26px #0003;transform:rotate(5deg);z-index:1}
.bb .arr{z-index:3}
.b1{grid-column:1/-1;background:#1c2b52;color:#fff;min-height:220px}.b1:before{content:"";position:absolute;inset:-24px;background:var(--img,none) center/cover;filter:blur(22px) brightness(.5);z-index:0}.b1 .arr{background:#ffffff33;color:#fff}.b1 b{font-size:1.5rem}
.b2{background:var(--sand)}.b3{background:var(--tan)}.b4{grid-column:1/-1;background:var(--ol);color:#fff}.b4 .arr{background:#ffffff33;color:#fff}
@media(min-width:760px){.bento{grid-template-columns:2fr 1fr;grid-auto-rows:minmax(210px,auto)}.b1{grid-column:auto}.b2{grid-column:auto}.b3{grid-column:auto}.b4{grid-column:span 1}.bento{grid-template-columns:2fr 1fr}.b3{grid-column:1}.b4{grid-column:2/3}.bb img{width:34%}}
/* featured colored cards with price badge + waves */
.featwrap{position:relative;background:#fff;margin:26px 0 8px;padding:44px 0 46px}.wv{position:absolute;left:0;width:100%;height:36px}.wv.up{top:-1px}.wv.dn{bottom:-1px}

.frate{margin:4px 0 8px;color:#fff}.frate .stt{color:#ffe08a}.pbtn{margin-top:8px;background:#101a36;color:#fff;border:0;border-radius:999px;padding:8px 20px;font:inherit;font-weight:600;cursor:pointer}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stp{border-radius:18px;padding:12px;color:#fff;display:flex;flex-direction:column;gap:4px}.stp b{font-family:'Noto Serif Bengali',serif;font-size:1.9rem;line-height:1}.stp span{font-size:.78rem;line-height:1.35}.stp.t1{background:var(--teal)}.stp.t2{background:var(--am)}.stp.t3{background:var(--ink)}

.ac{border-radius:24px;padding:10px 10px 14px;background:#fff;border:1px solid var(--ln);box-shadow:none;text-align:left}.ac .av{width:100%;height:auto;aspect-ratio:4/5;border-radius:18px;border:0;margin:0 0 10px;object-fit:cover}.ac b{font-family:'Noto Serif Bengali',serif;display:block;font-size:1rem}.ac small{color:var(--mu)}
.wgrid{gap:12px}.wc{border-radius:24px;border:1px solid var(--ln);padding:10px 10px 14px;align-items:flex-start;text-align:left}.wc .wph{width:100%;height:auto;aspect-ratio:4/5;border-radius:18px;border:0}.wc h3{font-size:1.02rem}.wc .btn{margin-top:6px}

.fph{border-color:var(--bg)}.fname{font-family:'Noto Serif Bengali',serif;font-weight:600;font-size:clamp(1.7rem,6vw,2.6rem)}.fdes{font-size:1.02rem}.fshort{font-family:'Noto Serif Bengali',serif;font-size:1.15rem;line-height:1.9}
