<style>
:root{--ink:#0b1b3f;--blue:#1e47b8;--go:#c2963f;--go2:#8f6a22;--bg:#f3f5fa;--card:#fff;--ln:#e1e6f1;--tx:#111b36;--mu:#5b6785;--ok:#168a5b;--rd:#c73b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 'Hind Siliguri',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:'Noto Serif Bengali','Hind Siliguri',serif;color:var(--ink);line-height:1.35;margin:0 0 8px}
h2{font-size:1.25rem}a{color:var(--blue);text-decoration:none}.mu{color:var(--mu)}
:focus-visible{outline:3px solid var(--go);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.top{position:sticky;top:0;z-index:30;background:var(--ink);box-shadow:0 2px 16px #0b1b3f55}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;max-width:1200px;margin:auto}.sp{flex:1}
.lg{height:40px;border-radius:10px;background:#fff;padding:2px;cursor:pointer}
.ava{width:38px;height:38px;border-radius:50%;border:2px solid var(--go);background:#1e47b8;color:#fff;cursor:pointer;padding:0;overflow:hidden;font-size:1rem}.ava img{width:100%;height:100%;object-fit:cover}
.nav{display:none;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:1200px;margin:auto}
.nv{flex:none;border:0;background:transparent;color:#c7d2ee;padding:7px 14px;border-radius:99px;font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}.nv:hover{background:#ffffff18}.nv.on{background:var(--go);color:#fff;font-weight:600}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px #0b1b3f14}
.tabbar button{flex:1;border:0;background:none;font:inherit;font-size:.72rem;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer}.tabbar span{font-size:1.35rem;line-height:1.3}.tabbar .on{color:var(--blue);font-weight:700}
@media(min-width:820px){.nav{display:flex}.tabbar{display:none}body{padding-bottom:0}}
.wrap{max-width:1200px;margin:auto;padding:16px 14px}
.hero{background:var(--ink);line-height:0}.hero img.bn{width:100%;max-height:520px;object-fit:cover;display:block;min-height:150px}
.cta{max-width:760px;margin:-22px auto 0;position:relative;z-index:2;padding:0 14px}.cta .in2{background:#fff;border-radius:18px;box-shadow:0 14px 34px #0b1b3f2e;padding:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.vp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:18px}.vp div{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 14px;font-size:.92rem}.vp b{display:block;color:var(--ink)}
.sh-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px}
.shelf{position:relative}.shelf:after{content:"";position:absolute;left:0;right:0;bottom:8px;height:12px;border-radius:6px;background:linear-gradient(#dfe5f2,#c5cde2);box-shadow:0 10px 16px #0b1b3f26}
.rs{position:relative;z-index:1;display:flex;gap:18px;overflow-x:auto;padding:14px 8px 26px;scroll-snap-type:x proximity;perspective:1000px}.rs .bk{flex:0 0 136px;scroll-snap-align:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px 8px;text-align:center;cursor:pointer;color:var(--ink);font:inherit;font-weight:600;transition:.2s}.tile:hover{border-color:var(--go);box-shadow:0 10px 22px #0b1b3f1c;transform:translateY(-3px)}.tile span{display:block;font-size:1.9rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.chip{flex:none;border:1px solid var(--ln);background:#fff;color:var(--tx);padding:6px 15px;border-radius:99px;font:inherit;font-size:.9rem;cursor:pointer}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--ln);border-radius:12px;background:#fff;color:var(--tx);font:inherit}input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px #1e47b826}

 async ssicatdel(id){if(!confirm('বিভাগটি মুছবেন? আইটেমগুলোর বিভাগের নাম থেকে যাবে।'))return;await sb.from('ssi_categories').delete().eq('id',id);render()},
 async ssisrcadd(){const u=V('#ss2');if(!V('#ss1'))return toast('উৎসের নাম দিন');if(u&&!/^https?:\/\//i.test(u))return toast('URL http বা https দিয়ে শুরু হতে হবে');const r=await sb.from('ssi_sources').insert({name:V('#ss1'),url:u||null,kind:V('#ss3'),license_note:V('#ss4')||null});if(r.error)return toast('ত্রুটি');render()},
 async ssisrctog(p){const [id,v]=p.split(':');await sb.from('ssi_sources').update({active:v==='1'}).eq('id',id);render()},
 async ssisrcdel(id){if(!confirm('উৎসটি মুছবেন?'))return;await sb.from('ssi_sources').delete().eq('id',id);render()},
 async ssisetsave(){const rows=[['provider',V('#st1')],['model',V('#st2')],['tone',V('#st3')],['words',V('#st4')||'800'],['prompt',V('#st5')]];const r=await sb.from('ssi_settings').upsert(rows.map(([key,value])=>({key,value})));toast(r.error?'ত্রুটি':'সেভ হয়েছে')},
 async logout(){await sb.auth.signOut();await load();S.view='home';render()},
 async saveprof(){try{let av=S.prof&&S.prof.avatar_url;const f=$('#pf').files[0];if(f)av=await up('avatars',S.user.id+'/avatar.jpg',f,400);
  const r=await sb.from('profiles').upsert({id:S.user.id,full_name:V('#pn'),phone:V('#pp'),avatar_url:av});if(r.error)throw r.error;await load();toast('সেভ হয়েছে');render()}catch(e){toast('ত্রুটি: '+e.message)}},
 async saveb(id){if(!V('#e1'))return toast('বইয়ের নাম দিন');try{let o={title:V('#e1'),author:[...document.querySelectorAll('.aun')].map(i=>i.value.trim()).filter(Boolean).join(', '),description:V('#e3'),price:+V('#e4')||0,sale_price:+V('#e5')||0,mode:V('#e6'),stock:V('#e7')===''?null:+V('#e7'),type:V('#e8'),category:V('#e9'),series:V('#e10')||null,muslim:$('#e11').checked,popularity:+V('#e12')||0,is_popular:$('#e15').checked,lang_kind:V('#e16'),translator:V('#e17')||null,audience:V('#e18'),preview_pages:+V('#e21')||0,issue_label:V('#e22')||null};
  const f=$('#e13').files[0];if(f){const ts=Date.now();o.cover_url=await up('assets','covers/'+ts+'.jpg',f,1800);o.cover_thumb=await up('assets','covers/'+ts+'_t.jpg',f,600)}if(id)o.id=id;
  const r=await sb.from('books').upsert(o).select().single();if(r.error)throw r.error;const pg=[...($('#e20').files||[])].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  if(pg.length){const bid=r.data.id;const old=await sb.storage.from('pages').list(bid,{limit:1000});if(old.data&&old.data.length)await sb.storage.from('pages').remove(old.data.map(f=>bid+'/'+f.name));
   for(let i=0;i<pg.length;i++){toast('পাতা আপলোড '+bn(i+1)+'/'+bn(pg.length));const bl=await resize(pg[i],1600);const u=await sb.storage.from('pages').upload(bid+'/'+String(i+1).padStart(4,'0')+'.jpg',bl,{contentType:'image/jpeg',upsert:true});if(u.error)throw u.error}
   await sb.from('books').update({page_count:pg.length}).eq('id',bid)}
  let flink=V('#e14');const bf=$('#e23').files[0];
  if(bf){toast('ফাইল আপলোড হচ্ছে…');const ext=(bf.name.split('.').pop()||'pdf').replace(/[^a-z0-9]/gi,'').slice(0,5)||'pdf';const pth=r.data.id+'/'+Date.now()+'.'+ext;const fu=await sb.storage.from('files').upload(pth,bf,{contentType:bf.type||'application/octet-stream'});if(fu.error)throw fu.error;flink='storage:'+pth}
  const l=await sb.from('book_files').upsert({book_id:r.data.id,link:flink});if(l.error)throw l.error;await load();modal('');toast('সেভ হয়েছে');render()}catch(e){toast('ত্রুটি: '+e.message)}},
 async delb(id){if(!confirm('মুছে ফেলবেন?'))return;await sb.from('books').delete().eq('id',id);await load();render()},
 async ord(p){const [id,st]=p.split(':');await sb.from('orders').update({status:st}).eq('id',id);S.pend=Math.max(0,(S.pend||0)-1);toast(st==='approved'?'অনুমোদিত':'বাতিল');render()},
 async savea(id){if(!V('#a1'))return toast('নাম দিন');try{let o={name:V('#a1'),bio:V('#a2'),sort:+V('#a4')||0,links:$('#a5').value.trim()||null};const f=$('#a3').files[0];if(f)o.photo_url=await up('assets','authors/'+Date.now()+'.jpg',f,1000);if(id)o.id=id;
  const r=await sb.from('authors').upsert(o);if(r.error)throw r.error;await load();modal('');toast('সেভ হয়েছে');render()}catch(e){toast('ত্রুটি: '+e.message)}},
 async dela(id){if(!confirm('মুছে ফেলবেন?'))return;await sb.from('authors').delete().eq('id',id);await load();render()},
 async saveset(){try{const rows=[['bkash',V('#s1')],['nagad',V('#s2')],['whatsapp',V('#s3')],['delivery_dhaka',V('#s5')||'70'],['delivery_outside',V('#s6')||'90'],['video_title',V('#s8')]];const vf=$('#s7').files[0];if(vf){toast('ভিডিও আপলোড হচ্ছে…');const vr=await sb.storage.from('assets').upload('video/site-'+Date.now()+'.'+(vf.name.split('.').pop()||'mp4'),vf,{contentType:vf.type});if(vr.error)throw vr.error;rows.push(['video_url',sb.storage.from('assets').getPublicUrl(vr.data.path).data.publicUrl])}const f=$('#s4').files[0];if(f)rows.push(['banner_url',await up('assets','banner.jpg',f,2400)]);
  const r=await sb.from('site_settings').upsert(rows.map(([key,value])=>({key,value})));if(r.error)throw r.error;await load();toast('সেভ হয়েছে');render()}catch(e){toast('ত্রুটি: '+e.message)}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.dataset.a==='ovl'&&e.target!==t)return;if(t.tagName==='A')e.preventDefault();const i=t.dataset.a.indexOf(':');const a=i<0?t.dataset.a:t.dataset.a.slice(0,i),p=i<0?'':t.dataset.a.slice(i+1);if(a==='ovl')return modal('');if(A[a])A[a](p,t)});
document.addEventListener('change',async e=>{const k=e.target.dataset&&e.target.dataset.icon;if(!k||!e.target.files[0])return;try{const u=await up('assets','icons/'+k+'.jpg',e.target.files[0],160);const r=await sb.from('site_settings').upsert({key:'icon_'+k,value:u});if(r.error)throw r.error;await load();toast('আইকন বদলেছে');render()}catch(er){toast('ত্রুটি: '+er.message)}});
document.addEventListener('change',e=>{if(e.target.id==='aisel'&&S._ai){$('#ait').value=S._ai[e.target.value]||''}});
document.addEventListener('change',async e=>{const id=e.target.dataset&&e.target.dataset.ship;if(!id)return;const r=await sb.from('orders').update({ship_status:e.target.value}).eq('id',id);toast(r.error?'ত্রুটি':'অবস্থা বদলেছে')});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.sf;if(k){S.sf=S.sf||{};S.sf[k]=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(!S._rd)return;if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1);if(e.key==='Escape')A.rclose()});
document.addEventListener('input',e=>{if(e.target.id&&e.target.id.startsWith('ck_')){S.co=S.co||{};S.co[e.target.id]=e.target.value}});
document.addEventListener('input',async e=>{if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;await render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
addEventListener('scroll',()=>{const t=$('.top');if(t)t.classList.toggle('sc',scrollY>40)},{passive:true});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFER=e;if(typeof render==='function'&&S.view==='home')render()});
(async()=>{$('#app').innerHTML=`<div class="top"><div class="bar"><img class="lg" src="${LOGO}"></div></div><div class="sk" style="height:220px;margin:0"></div><div class="sk"></div><div class="sk"></div>`;await load();await render();const b=new URLSearchParams(location.search).get('b');if(b)bookModal(b);const ua=new URLSearchParams(location.search).get('a');if(ua)authorModal(ua)})();
