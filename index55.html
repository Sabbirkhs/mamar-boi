<style>
:root{--ink:#0b1b3f;--blue:#1e47b8;--go:#c2963f;--go2:#8f6a22;--bg:#f3f5fa;--card:#fff;--ln:#e1e6f1;--tx:#111b36;--mu:#5b6785;--ok:#168a5b;--rd:#c73b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 'Hind Siliguri',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:'Noto Serif Bengali','Hind Siliguri',serif;color:var(--ink);line-height:1.35;margin:0 0 8px}
h2{font-size:1.25rem}a{color:var(--blue);text-decoration:none}.mu{color:var(--mu)}
:focus-visible{outline:3px solid var(--go);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.top{position:sticky;top:0;z-index:30;background:var(--ink);box-shadow:0 2px 16px #0b1b3f55}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;max-width:1200px;margin:auto}.sp{flex:1}
.lg{height:40px;border-radius:10px;background:#fff;padding:2px;cursor:pointer}
.ava{width:38px;height:38px;border-radius:50%;border:2px solid var(--go);background:#1e47b8;color:#fff;cursor:pointer;padding:0;overflow:hidden;font-size:1rem}.ava img{width:100%;height:100%;object-fit:cover}
.nav{display:none;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:1200px;margin:auto}
.nv{flex:none;border:0;background:transparent;color:#c7d2ee;padding:7px 14px;border-radius:99px;font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}.nv:hover{background:#ffffff18}.nv.on{background:var(--go);color:#fff;font-weight:600}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px #0b1b3f14}
.tabbar button{flex:1;border:0;background:none;font:inherit;font-size:.72rem;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer}.tabbar span{font-size:1.35rem;line-height:1.3}.tabbar .on{color:var(--blue);font-weight:700}
@media(min-width:820px){.nav{display:flex}.tabbar{display:none}body{padding-bottom:0}}
.wrap{max-width:1200px;margin:auto;padding:16px 14px}
.hero{background:var(--ink);line-height:0}.hero img.bn{width:100%;max-height:520px;object-fit:cover;display:block;min-height:150px}
.cta{max-width:760px;margin:-22px auto 0;position:relative;z-index:2;padding:0 14px}.cta .in2{background:#fff;border-radius:18px;box-shadow:0 14px 34px #0b1b3f2e;padding:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.vp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:18px}.vp div{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 14px;font-size:.92rem}.vp b{display:block;color:var(--ink)}
.sh-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px}
.shelf{position:relative}.shelf:after{content:"";position:absolute;left:0;right:0;bottom:8px;height:12px;border-radius:6px;background:linear-gradient(#dfe5f2,#c5cde2);box-shadow:0 10px 16px #0b1b3f26}
.rs{position:relative;z-index:1;display:flex;gap:18px;overflow-x:auto;padding:14px 8px 26px;scroll-snap-type:x proximity;perspective:1000px}.rs .bk{flex:0 0 136px;scroll-snap-align:start}

.tile{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px 8px;text-align:center;cursor:pointer;color:var(--ink);font:inherit;font-weight:600;transition:.2s}.tile:hover{border-color:var(--go);box-shadow:0 10px 22px #0b1b3f1c;transform:translateY(-3px)}.tile span{display:block;font-size:1.9rem}

/* ===== v18 design layer: warm editorial, curved carousel, bento ===== */
:root{--bg:#fbf7ee;--card:#fff;--ink:#101a36;--tx:#1b2238;--mu:#6b6f7e;--ln:#e9e1d0;--go:#b8893a;--go2:#8f6a22;--ol:#59673f;--tan:#c9b08f;--sand:#efe6d4;--teal:#0f6d6a;--am:#e5a23a;--pb0:#dfe6ef;--pb1:#e3e9d6;--pb2:#f5dfd1;--pb3:#e7dff1;--pb4:#dcebf3}
body{background:var(--bg);color:var(--tx)}
h1,h2,h3{font-family:'Noto Serif Bengali','Noto Sans Bengali',serif;color:var(--ink)}
h2{font-size:1.45rem;font-weight:600}
.top{background:rgba(251,247,238,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);box-shadow:none}
.bar{gap:8px}.brand{font-family:'Noto Serif Bengali',serif;font-weight:700;color:var(--ink);cursor:pointer;font-size:1.05rem;white-space:nowrap}
.top .lg{border:1px solid var(--ln);padding:2px}
.ibtn{border:1px solid var(--ln);background:#fff;color:var(--ink);box-shadow:none;backdrop-filter:none}
.ava{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--go)}.ava{background:var(--sand);color:var(--ink)}
.nav{padding-bottom:6px}.nv{color:var(--mu)}.nv:hover{background:var(--sand)}.nv.on{background:var(--ink);color:#fff;font-weight:600}
.btn{border-radius:999px;box-shadow:none;background:var(--ink);padding:11px 20px;letter-spacing:.01em}.btn:active{transform:scale(.98);box-shadow:none}
.btn.go{background:var(--ink)}.btn.ok{background:var(--ol)}.btn.dng{background:#a93b3b}.btn.gh{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}.btn.gh3{background:transparent;border:1.5px solid #ffffff80;color:#fff}.btn.sm{padding:7px 14px}
input,select,textarea{border-radius:14px;background:#fff;border:1.5px solid var(--ln)}input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px #101a3615}
.gl{border-radius:20px;background:#fff;border:1px solid var(--ln);box-shadow:none}
.chip{background:#fff;border-radius:999px}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabbar{background:rgba(251,247,238,.96);border-top:1px solid var(--ln)}.tabbar .on{color:var(--ink)}.tabbar .on:after{background:var(--ink)}
.eyebrow{color:var(--go2);letter-spacing:.2em}.eyebrow.dk{color:var(--go2)}
/* hero: typographic + curved carousel */
.hero5{position:relative;text-align:center;padding:30px 14px 4px;overflow:hidden}.hero5 .sw{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.h5in{position:relative;max-width:760px;margin:0 auto}.h5in h1{margin:6px 0 10px;line-height:1.25}.h1a{display:block;font-weight:400;font-size:clamp(1.45rem,5.2vw,2.5rem)}.h1b{display:block;font-family:'Noto Sans Bengali',sans-serif;font-weight:700;font-size:clamp(1.9rem,7vw,3.4rem);letter-spacing:-.01em}
.h5in p{max-width:540px;margin:0 auto 16px;color:var(--mu)}.hero5 .hb{justify-content:center}
.pill-btn{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:6px 6px 6px 22px;font:inherit;font-weight:600;cursor:pointer}.pill-btn i{width:34px;height:34px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-style:normal}
.pill-out{background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:999px;padding:9px 22px;font:inherit;font-weight:600;cursor:pointer}
.curve{display:flex;justify-content:center;align-items:center;perspective:1100px;padding:30px 0 22px;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.cc{flex:0 0 auto;width:clamp(64px,13.5vw,168px);margin:0 clamp(-8px,-.5vw,-2px);border:0;background:none;padding:0;cursor:pointer;transform:translateY(calc(var(--d)*var(--d)*7px)) rotateY(calc(var(--d)*-17deg)) scale(calc(1.06 - var(--d)*var(--d)*.025));transition:transform .3s}
.cc:hover,.cc:focus-visible{transform:translateY(calc(var(--d)*var(--d)*7px - 6px)) rotateY(calc(var(--d)*-10deg)) scale(1.1)}
.cc img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:14px;box-shadow:0 14px 28px #101a3630;background:#e7dfce}
@media(max-width:600px){.cc.far{display:none}.cc{width:clamp(70px,19vw,120px)}}
.tri{display:grid;grid-template-columns:1fr;gap:0;margin:6px 0 22px;text-align:center}.tri>div{padding:14px 12px;border-top:1px solid var(--ln)}.tri b{display:block;font-family:'Noto Serif Bengali',serif;color:var(--ink)}.tri small{color:var(--mu);line-height:1.6}
@media(min-width:760px){.tri{grid-template-columns:repeat(3,1fr)}.tri>div{border-top:0;border-left:1px solid var(--ln)}.tri>div:first-child{border-left:0}}
/* book cards: pastel panel + flat cover */
.bk .in{padding:10px 4px 0}.bk .in b{font-family:'Noto Serif Bengali',serif;font-weight:600}.pr{color:var(--ink)}
.cvw{background:var(--pb0);border-radius:20px;padding:16px 14px 18px;transition:transform .2s}.cvw.p1{background:var(--pb1)}.cvw.p2{background:var(--pb2)}.cvw.p3{background:var(--pb3)}.cvw.p4{background:var(--pb4)}

/* topics: pastel tiles */
.topics{gap:12px}.topic{position:relative;border:0;border-radius:22px;min-height:132px;padding:14px;background:var(--pb0)}.topic.t1{background:var(--pb1)}.topic.t2{background:var(--pb2)}.topic.t3{background:var(--pb3)}.topic.t4{background:var(--pb4)}
.topic b{font-size:1.15rem;color:var(--ink);opacity:.5}.topic span{font-family:'Noto Serif Bengali',serif;font-size:1.02rem}.arr{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;background:#ffffffb3;display:grid;place-items:center;font-style:normal;color:var(--ink);font-size:.95rem}
/* bento */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.bb img{position:absolute;right:14px;bottom:-6px;width:38%;max-width:150px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;box-shadow:0 14px 26px #0003;transform:rotate(5deg);z-index:1}
.bb .arr{z-index:3}
.b1{grid-column:1/-1;background:#1c2b52;color:#fff;min-height:220px}.b1:before{content:"";position:absolute;inset:-24px;background:var(--img,none) center/cover;filter:blur(22px) brightness(.5);z-index:0}.b1 .arr{background:#ffffff33;color:#fff}.b1 b{font-size:1.5rem}
.b2{background:var(--sand)}.b3{background:var(--tan)}.b4{grid-column:1/-1;background:var(--ol);color:#fff}.b4 .arr{background:#ffffff33;color:#fff}
@media(min-width:760px){.bento{grid-template-columns:2fr 1fr;grid-auto-rows:minmax(210px,auto)}.b1{grid-column:auto}.b2{grid-column:auto}.b3{grid-column:auto}.b4{grid-column:span 1}.bento{grid-template-columns:2fr 1fr}.b3{grid-column:1}.b4{grid-column:2/3}.bb img{width:34%}}
/* featured colored cards with price badge + waves */
.featwrap{position:relative;background:#fff;margin:26px 0 8px;padding:44px 0 46px}.wv{position:absolute;left:0;width:100%;height:36px}.wv.up{top:-1px}.wv.dn{bottom:-1px}

.frate{margin:4px 0 8px;color:#fff}.frate .stt{color:#ffe08a}.pbtn{margin-top:8px;background:#101a36;color:#fff;border:0;border-radius:999px;padding:8px 20px;font:inherit;font-weight:600;cursor:pointer}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stp{border-radius:18px;padding:12px;color:#fff;display:flex;flex-direction:column;gap:4px}.stp b{font-family:'Noto Serif Bengali',serif;font-size:1.9rem;line-height:1}.stp span{font-size:.78rem;line-height:1.35}.stp.t1{background:var(--teal)}.stp.t2{background:var(--am)}.stp.t3{background:var(--ink)}

.ac{border-radius:24px;padding:10px 10px 14px;background:#fff;border:1px solid var(--ln);box-shadow:none;text-align:left}.ac .av{width:100%;height:auto;aspect-ratio:4/5;border-radius:18px;border:0;margin:0 0 10px;object-fit:cover}.ac b{font-family:'Noto Serif Bengali',serif;display:block;font-size:1rem}.ac small{color:var(--mu)}
.wgrid{gap:12px}.wc{border-radius:24px;border:1px solid var(--ln);padding:10px 10px 14px;align-items:flex-start;text-align:left}.wc .wph{width:100%;height:auto;aspect-ratio:4/5;border-radius:18px;border:0}.wc h3{font-size:1.02rem}.wc .btn{margin-top:6px}

const BNR=/[\u0980-\u09FF]/,dig=t=>t.replace(/[০-৯]/g,c=>'০১২৩৪৫৬৭৮৯'.indexOf(c));
function trCore(core,Dd){if(!BNR.test(core))return null;const ds=[],key=core.replace(/[০-৯]+/g,m=>{ds.push(dig(m));return '#'});let v=Dd[key];
 if(v===undefined){const m=key.match(/^([^\u0980-\u09FFA-Za-z#]*)([\s\S]*?)([^\u0980-\u09FFA-Za-z#]*)$/);if(m&&(m[1]||m[3])&&m[2]){const w=Dd[m[2]];if(w!==undefined)v=m[1]+w+m[3]}}
 if(v===undefined&&/^[^\u0980-\u09FF]*ত্রুটি: /.test(key)){const k2=key.replace(/^([^\u0980-\u09FF]*)ত্রুটি: /,'');v=(Dd['ত্রুটি:']||'Error:')+' '+k2}

const resize=(f,w)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=document.createElement('canvas');const s=Math.min(1,w/i.width);k.width=i.width*s;k.height=i.height*s;const cx=k.getContext('2d');cx.imageSmoothingQuality='high';cx.drawImage(i,0,0,k.width,k.height);k.toBlob(r,'image/jpeg',.93)};i.src=URL.createObjectURL(f)});
async function up(bucket,path,file,w){const bl=await resize(file,w);const r=await sb.storage.from(bucket).upload(path,bl,{upsert:true,contentType:'image/jpeg'});if(r.error)throw r.error;return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl+'?v='+Date.now()}

function myNotifs(){

 }).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));

function rteFmt(cmd,val){

}

}

}

// Custom Episode Reader Overlay (.erd)
function openEpReader(bookId,chapIdx){
 const b=S.books.find(x=>x.id===bookId);if(!b)return;
 const chs=S.admin||(bookMeta(bookId).author_user_id===uidKey())?bookChaps(bookId):pubChaps(bookId);
 if(!chs.length)return toast('এই বইয়ে এখনো কোনো পর্ব যুক্ত হয়নি');
 const i=Math.max(0,Math.min(chs.length-1,+chapIdx||0));
 const canFull=b.mode==='free'||S.owned.has(bookId)||bookMeta(bookId).author_user_id===uidKey();
 if(!canFull&&i>=(b.preview_pages||1)){
  bookModal(bookId);
  return toast('বাকি পর্বগুলো পড়তে অনুগ্রহ করে বইটি কিনুন');
 }
 const prefs=lsGet('mb_ep_prefs',{theme:'paper',size:18,font:'serif'});
 S._erd={bookId,i,prefs};
 // Mark read & increment local view
 const rmap=lsGet('mb_ep_read_'+uidKey(),{});
 const set=new Set(rmap[bookId]||[]);set.add(chs[i].id);rmap[bookId]=[...set];lsSet('mb_ep_read_'+uidKey(),rmap);
 modal('');
 let el=document.querySelector('.erd');
 if(!el){el=document.createElement('div');el.className='erd';document.body.appendChild(el)}
 drawEpReader();
}
function drawEpReader(){
 const st=S._erd,el=document.querySelector('.erd');if(!st||!el)return;
 const b=S.books.find(x=>x.id===st.bookId);if(!b)return;
 const chs=S.admin||(bookMeta(b.id).author_user_id===uidKey())?bookChaps(b.id):pubChaps(b.id);
 const ch=chs[st.i];if(!ch)return;
 const pf=st.prefs;
 el.className='erd t-'+pf.theme;

<script id="mb-step2">
/* MAMAR BOI ধাপ ২: যৌথ বই আহ্বান + নোটিফিকেশন (নতুন নিরাপদ টেবিল) */
(()=>{
const ST={draft:'খসড়া সংরক্ষিত',submitted:'জমা দেওয়া হয়েছে',reviewing:'অ্যাডমিন পর্যালোচনা করছেন',approved:'অনুমোদিত',returned:'সংশোধনের জন্য ফেরত',cancelled:'বাতিল',none:'লেখা জমা হয়নি'};
const AS={pending:'অপেক্ষমাণ',approved:'অনুমোদিত',rejected:'বাতিল'};
const BS={draft:'খসড়া',published:'প্রকাশিত',closed:'বন্ধ',cancelled:'বাতিল'};
const q=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
const dt=d=>d?new Date(d).toLocaleDateString('bn-BD'):'';
const E=e=>toast('ত্রুটি: '+(e.message||e));
const cls=s=>s==='approved'?'approved':(s==='returned'||s==='rejected'||s==='cancelled')?'rejected':'pending';

/* ===== নোটিফিকেশন ===== */
S.nt=[];let ntCh=null,lastU=null;
async function ntLoad(){if(!S.user){S.nt=[];return}try{S.nt=await q(sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(100))}catch(e){}}
function ntLive(){if(!S.user||ntCh)return;ntCh=sb.channel('nt'+S.user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+S.user.id},p=>{S.nt.unshift(p.new);toast('🔔 '+p.new.title);render()}).subscribe()}
async function ntInit(){const u=S.user?S.user.id:null;if(u===lastU)return;lastU=u;if(ntCh){sb.removeChannel(ntCh);ntCh=null}await ntLoad();ntLive();render()}
setTimeout(ntInit,1200);
sb.auth.onAuthStateChange(()=>setTimeout(ntInit,900));
myNotifs=()=>S.nt||[];
unreadNotifCount=()=>(S.nt||[]).filter(n=>!n.is_read).length;
markAllNotifsRead=()=>{const ids=(S.nt||[]).filter(n=>!n.is_read).map(n=>n.id);S.nt.forEach(n=>n.is_read=true);if(ids.length)sb.from('notifications').update({is_read:true}).in('id',ids).then(()=>{})};
openNotifModal=()=>{const L=S.nt||[];
 modal(`<h3>🔔 নোটিফিকেশন (${bn(L.length)})</h3>${L.length?`<div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn gh sm" data-a="nt_readall">সব পড়া হয়েছে</button><button class="btn gh sm" data-a="nt_clear">পড়াগুলো সরান</button></div>`:''}`+(L.length?L.map(n=>`<div class="gl" data-a="nt_open:${n.id}" role="button" tabindex="0" style="cursor:pointer;${n.is_read?'opacity:.65':'border-left:4px solid var(--go)'}">${n.image_url?`<img src="${esc(n.image_url)}" alt="" style="width:100%;border-radius:10px;margin-bottom:6px">`:''}<b>${n.is_read?'':'🔴 '}${esc(n.title)}</b><p style="margin:4px 0;font-size:.9rem">${esc(n.body)}</p><small class="mu">${dt(n.created_at)}</small></div>`).join(''):'<p class="mu">কোনো নোটিফিকেশন নেই</p>'))};
pushNotification=async({title,message,target='all',target_user_id=null})=>{try{if(target==='user'&&target_user_id)await q(sb.from('notifications').insert({user_id:target_user_id,title,body:message}));else await q(sb.rpc('send_notification',{p_title:title,p_body:message,p_image:'',p_link:'',p_targets:[target==='authors'?'authors':target==='readers'?'readers':'all']}))}catch(e){}};
adminNotifH=async()=>{const B=await q(sb.from('notification_batches').select('*').order('created_at',{ascending:false}).limit(40));

 const[B,A2]=await Promise.all([q(sb.from('joint_books').select('*').in('status',['published','closed']).order('created_at',{ascending:false})),q(sb.from('joint_applications').select('book_id,status').eq('user_id',S.user.id))]);
 const ap=Object.fromEntries(A2.map(a=>[a.book_id,a.status]));
 return `<div class="gl"><h3>📖 যৌথ বইয়ে জমা দাও</h3></div>`+(B.length?B.map(b=>`<div class="gl" data-a="jb_detail:${b.id}" role="button" tabindex="0" style="cursor:pointer;display:flex;gap:10px"><img src="${esc(b.cover||LOGO)}" alt="" style="width:64px;height:90px;object-fit:cover;border-radius:8px"><div><b>${esc(b.title)}</b><p class="mu" style="font-size:.85rem;margin:3px 0">${esc((b.intro||'').slice(0,110))}</p><small>${bn(b.total_ch)}টি অধ্যায় • শেষ তারিখ: ${dt(b.deadline)||'নেই'} • <b>${ap[b.id]?'আবেদন '+AS[ap[b.id]]:b.status==='closed'?'বন্ধ':'আবেদন খোলা'}</b></small></div></div>`).join(''):'<div class="gl"><p class="mu">এখন কোনো আহ্বান নেই</p></div>')};
jointBookDetailH=async id=>{if(!S.user)return '<div class="gl"><p>আগে লগইন করুন</p></div>';
 const b=await q(sb.from('joint_books').select('*').eq('id',id).single());
 const[a,c]=await Promise.all([q(sb.from('joint_applications').select('status').eq('book_id',id).eq('user_id',S.user.id).maybeSingle()),q(sb.from('joint_chapters').select('chapter_no,status,admin_note').eq('book_id',id).eq('user_id',S.user.id))]);
 const cm=Object.fromEntries(c.map(x=>[x.chapter_no,x]));const done=c.filter(x=>x.status==='approved').length,sent=c.filter(x=>['submitted','reviewing','approved'].includes(x.status)).length;
 const open=b.status==='published'&&(!b.deadline||b.deadline>=new Date().toISOString().slice(0,10));
 let act='';
 if(!a)act=open?`<button class="btn go w" data-a="jb_apply_modal:${id}">অংশগ্রহণ করুন</button>`:'<p class="mu">আবেদনের সময় শেষ</p>';
 else if(a.status==='pending')act='<p class="st pending" style="display:block;padding:8px">আপনার আবেদন অ্যাডমিনের অনুমোদনের অপেক্ষায়</p>';
 else if(a.status==='rejected')act='<p class="st rejected" style="display:block;padding:8px">এই আহ্বানে আপনার আবেদন গৃহীত হয়নি</p>';
 else act=`<h4>আপনার অগ্রগতি: ${bn(sent)}/${bn(b.total_ch)} জমা • ${bn(done)} অনুমোদিত</h4>`+(b.chapters||[]).map(ch=>{const x=cm[ch.no];return `<div class="row" data-a="jb_write:${id}|${ch.no}" role="button" tabindex="0" style="cursor:pointer"><div><b>অধ্যায় ${bn(ch.no)}: ${esc(ch.name)}</b><br><small class="mu">${esc(ch.note||'')}</small></div><span class="st ${cls(x?x.status:'')}">${ST[x?x.status:'none']}</span></div>`}).join('');
 return `<div class="gl"><button class="btn gh sm" data-a="go:jointbooks">← সব আহ্বান</button><img src="${esc(b.cover||LOGO)}" alt="" style="width:110px;border-radius:10px;display:block;margin:10px 0"><h3>${esc(b.title)}</h3>${b.en_title?`<small class="mu">${esc(b.en_title)}</small>`:''}<p>${esc(b.intro||'')}</p><small class="mu">বিষয়: ${esc(b.theme||'—')} • ধারা: ${esc(b.genre||'—')} • ${bn(b.total_ch)}টি অধ্যায় • প্রতি অধ্যায়ে সর্বোচ্চ ${bn(b.max_chars)} অক্ষর • শেষ তারিখ: ${dt(b.deadline)||'নেই'}</small>${b.rules?`<p style="white-space:pre-wrap;font-size:.88rem">${esc(b.rules)}</p>`:''}</div><div class="gl">${act}</div>`};

 const b=await q(sb.from('joint_books').select('title,max_chars,chapters').eq('id',id).single());

adminJointBooksH=async()=>{const B=await q(sb.from('joint_books').select('*').order('created_at',{ascending:false}));
 let h=`<div class="gl"><h3>📚 যৌথ বই আহ্বান</h3><p class="mu" style="font-size:.85rem">অংশগ্রহণকারীদের লেখা গোপন থাকে। “সবার জন্য পড়া” চালু করলে শুধু অনুমোদিত অংশগ্রহণকারীরা একে অপরের জমা দেওয়া লেখা দেখতে পাবে।</p><button class="btn go w" data-a="jb_new">➕ নতুন আহ্বান</button></div>`;

 return h+(S._jbSel?await jbPanel(S._jbSel):'')};
async function jbPanel(id){const[Ap,Ch]=await Promise.all([q(sb.from('joint_applications').select('*').eq('book_id',id).order('created_at')),q(sb.from('joint_chapters').select('id,user_id,chapter_no,status,submitted_at,body').eq('book_id',id).neq('status','draft').order('submitted_at',{ascending:false}))]);
 const nm=Object.fromEntries(Ap.map(a=>[a.user_id,a.author_name]));
 return `<div class="gl"><h4>আবেদন (${bn(Ap.length)})</h4>${Ap.map(a=>`<div class="row"><div><b>${esc(a.author_name)}</b> <span class="st ${cls(a.status)}">${AS[a.status]}</span><br><small class="mu">${esc(a.author_type||'')} • ${esc(a.genre||'')} • ${esc(a.author_info||'')}${Object.entries(a.answers||{}).map(([k,v])=>`<br>${esc(k)}: ${esc(v)}`).join('')}</small></div><div>${a.status!=='approved'?`<button class="btn go sm" data-a="jb_app:${a.id}|approved">অনুমোদন</button>`:''}${a.status!=='rejected'?`<button class="btn gh sm" data-a="jb_app:${a.id}|rejected">বাতিল</button>`:''}</div></div>`).join('')}</div><div class="gl"><h4>জমা পড়া লেখা (${bn(Ch.length)})</h4>${Ch.map(c=>`<div class="row"><div><b>${esc(nm[c.user_id]||'লেখক')}</b> • অধ্যায় ${bn(c.chapter_no)} <span class="st ${cls(c.status)}">${ST[c.status]}</span><br><small class="mu">${dt(c.submitted_at)} • ${bn(c.body.length)} অক্ষর</small></div><button class="btn gh sm" data-a="jb_read:${c.id}">📄 পড়ুন</button></div>`).join('')}</div>`}
jointFormModal=b=>{b=b||{total_ch:5,max_chars:4000};const f=(i,l,v,t)=>`<label>${l}</label><input id="${i}" ${t?'type="'+t+'"':''} value="${esc(v==null?'':v)}">`;
 modal(`<h3>${b.id?'আহ্বান সম্পাদনা':'নতুন যৌথ বইয়ের আহ্বান'}</h3><div class="f">${f('jb_t','বইয়ের বাংলা নাম *',b.title)}${f('jb_et','ইংরেজি নাম (ঐচ্ছিক)',b.en_title)}${f('jb_cov','প্রচ্ছদের ছবির লিংক',b.cover)}<label>অথবা গ্যালারি থেকে প্রচ্ছদ</label><input id="jb_cf" type="file" accept="image/*"><label>বইয়ের পরিচিতি ও উদ্দেশ্য *</label><textarea id="jb_int" rows="3">${esc(b.intro||'')}</textarea>${f('jb_tch','মোট অধ্যায়',b.total_ch,'number')}${f('jb_mc','প্রতি অধ্যায়ে সর্বোচ্চ অক্ষর',b.max_chars,'number')}${f('jb_th','বিষয় বা থিম',b.theme)}${f('jb_gn','লেখার ধরন ও সাহিত্যধারা',b.genre)}${f('jb_dl','অংশগ্রহণের শেষ তারিখ',b.deadline,'date')}<label>অধ্যায়ের নাম ও নির্দেশনা (প্রতি লাইনে একটি; “নাম: নির্দেশনা”)</label><textarea id="jb_chlist" rows="5">${esc((b.chapters||[]).map(c=>c.name+(c.note?': '+c.note:'')).join('\n'))}</textarea><label>আবেদনে অতিরিক্ত প্রশ্ন (প্রতি লাইনে একটি)</label><textarea id="jb_xq" rows="2">${esc((b.extra_questions||[]).join('\n'))}</textarea><label>অন্যান্য শর্তাবলি</label><textarea id="jb_rules" rows="3">${esc(b.rules||'')}</textarea><p class="mu" style="font-size:.82rem">অংশগ্রহণের অনুমোদন: অ্যাডমিন প্রতিটি আবেদন হাতে অনুমোদন করবেন।</p><button class="btn gh w" data-a="jb_save:${b.id||'new'}|draft">💾 খসড়া হিসেবে রাখুন</button><button class="btn go w" data-a="jb_save:${b.id||'new'}|publish">🚀 প্রকাশ করুন</button></div>`)};

Object.assign(A,{
 nt_readall(){markAllNotifsRead();openNotifModal();render()},
 async nt_clear(){try{await q(sb.from('notifications').delete().eq('is_read',true));S.nt=S.nt.filter(n=>!n.is_read);openNotifModal();render()}catch(e){E(e)}},
 nt_open(id){const n=S.nt.find(x=>x.id===id);if(!n)return;if(!n.is_read){n.is_read=true;sb.from('notifications').update({is_read:true}).eq('id',id).then(()=>{})}modal('');const l=n.link||'';if(/^https?:/.test(l))location.href=l;else if(l.startsWith('go:'))A.go(l.slice(3));else render()},
 async nfsend(){const t=V('#nf_t'),m=V('#nf_m'),g=[...document.querySelectorAll('.nf_tg:checked')].map(x=>x.value);if(!t||!m||!g.length)return toast('শিরোনাম, বার্তা ও প্রাপক দিন');try{await q(sb.rpc('send_notification',{p_title:t,p_body:m,p_image:V('#nf_i'),p_link:V('#nf_l'),p_targets:g}));toast('নোটিফিকেশন পাঠানো হয়েছে');render()}catch(e){E(e)}},
 async nfdel(id){if(!await ask('নোটিফিকেশনটি বাতিল করবেন? অপঠিত কপিগুলো সরে যাবে, ইতিহাস থাকবে।','বাতিল করুন'))return;try{await q(sb.rpc('cancel_notification',{p_batch:id}));render()}catch(e){E(e)}},
 jb_new(){jointFormModal()},
 async jb_edit(id){try{jointFormModal(await q(sb.from('joint_books').select('*').eq('id',id).single()))}catch(e){E(e)}},
 async jb_save(p){const[id,mode]=p.split('|');const t=V('#jb_t'),intro=V('#jb_int');if(!t||!intro)return toast('নাম ও পরিচিতি দিন');
  try{let cover=V('#jb_cov');const cf=$('#jb_cf')&&$('#jb_cf').files[0];if(cf)cover=await up('avatars',S.user.id+'/joint_'+Date.now()+'.jpg',cf,900);
   const lines=V('#jb_chlist').split('\n').map(x=>x.trim()).filter(Boolean),n=Math.max(1,+V('#jb_tch')||lines.length||1);
   const row={title:t,en_title:V('#jb_et')||null,cover:cover||null,intro,theme:V('#jb_th'),genre:V('#jb_gn'),rules:V('#jb_rules'),total_ch:n,max_chars:+V('#jb_mc')||4000,deadline:V('#jb_dl')||null,extra_questions:V('#jb_xq').split('\n').map(x=>x.trim()).filter(Boolean),chapters:Array.from({length:n},(_,i)=>{const l=lines[i]||('অধ্যায় '+(i+1)),k=l.indexOf(':');return{no:i+1,name:k>0?l.slice(0,k).trim():l,note:k>0?l.slice(k+1).trim():''}})};
   if(mode==='publish')row.status='published';
   await q(id==='new'?sb.from('joint_books').insert(row):sb.from('joint_books').update(row).eq('id',id));
   if(mode==='publish')pushNotification({title:'নতুন যৌথ বইয়ের আহ্বান',message:t,target:'authors'});
   modal('');toast('সংরক্ষিত হয়েছে');render()}catch(e){E(e)}},
 async jb_st(p){const[id,st]=p.split('|');try{await q(sb.from('joint_books').update({status:st}).eq('id',id));render()}catch(e){E(e)}},
 async jb_pubread(id){try{const b=await q(sb.from('joint_books').select('public_read').eq('id',id).single());await q(sb.from('joint_books').update({public_read:!b.public_read}).eq('id',id));toast(b.public_read?'গোপন করা হয়েছে':'অনুমোদিত অংশগ্রহণকারীরা এখন একে অপরের জমা দেওয়া লেখা দেখতে পারবে');render()}catch(e){E(e)}},

 return `<div class="gl"><h3>🏆 লেখকদের অবদান</h3><p class="mu" style="font-size:.85rem">বেস্টসেলার বই ও লেখকের প্রোফাইল শুধু অ্যাডমিন যোগ, সম্পাদনা বা সরাতে পারবেন।</p><button class="btn go w" data-a="ac_new">➕ নতুন বই ও লেখক</button><button class="btn gh w" data-a="ac_pick" style="margin-top:8px">📚 ওয়েবসাইটের বই থেকে লেখকের অবদান সেট করুন</button></div><div class="gl">${L.map(x=>`<div class="row">${x.book_cover?`<img src="${esc(x.book_cover)}" alt="">`:'<div class="th"></div>'}<div style="flex:1"><b>${esc(x.book_title)}</b><br><small class="mu">${esc(x.author_name)} • ক্রম ${bn(x.sort||0)} • ${x.active?'দৃশ্যমান':'লুকানো'}</small></div><button class="btn sm gh" data-a="ac_tog:${x.id}" title="দেখানো/লুকানো">${x.active?'👁':'🙈'}</button><button class="btn sm gh" data-a="ac_edit:${x.id}" title="সম্পাদনা">✏️</button><button class="btn sm gh" data-a="ac_del:${x.id}" title="মুছুন">🗑</button></div>`).join('')||'<p class="mu">এখনো কিছু যোগ হয়নি</p>'}</div>`};
const acForm=x=>{x=x||{badge:'বেস্টসেলার',sort:0,active:true};S._acBid=x.book_id||null;const f=(i,l,v,t)=>`<label>${l}</label><input id="${i}" ${t?`type="${t}"`:''} value="${esc(v==null?'':v)}">`;
 modal(`<h3>${x.id?'সম্পাদনা':'নতুন বই ও লেখক'}</h3>${x.book_id?'<p class="mu" style="font-size:.85rem">📚 ওয়েবসাইটের বই থেকে নেওয়া হয়েছে। লেখকের নতুন ছবি, বায়োডাটা ও বাকি তথ্য নিচে নিজে দিন।</p>':''}<div class="f">${f('ac_bt','বইয়ের নাম *',x.book_title)}${f('ac_bc','প্রচ্ছদের লিংক',x.book_cover)}<label>অথবা গ্যালারি থেকে প্রচ্ছদ</label><input id="ac_bcf" type="file" accept="image/*">${f('ac_bd','ব্যাজ (যেমন বেস্টসেলার)',x.badge)}${f('ac_an','লেখকের নাম *',x.author_name)}${f('ac_ap','লেখকের স্টাইলিশ ছবির লিংক',x.author_photo)}<label>অথবা গ্যালারি থেকে লেখকের ছবি</label><input id="ac_apf" type="file" accept="image/*">${f('ac_rl','লেখক কী করেন (পরিচয়)',x.role)}<label>বায়োডাটা</label><textarea id="ac_bio" rows="5">${esc(x.bio||'')}</textarea><label>উল্লেখযোগ্য কাজ (প্রতি লাইনে একটি)</label><textarea id="ac_nt" rows="3">${esc(x.notable||'')}</textarea>${f('ac_lk','বইয়ের লিংক (ঐচ্ছিক)',x.book_link)}${f('ac_so','ক্রম (ছোট সংখ্যা আগে)',x.sort,'number')}<button class="btn go w" data-a="ac_save:${x.id||'new'}">💾 সংরক্ষণ</button></div>`)};

  try{let bc=V('#ac_bc'),ap=V('#ac_ap');const a=$('#ac_bcf').files[0],b=$('#ac_apf').files[0];
   if(a)bc=await up('avatars',S.user.id+'/ac_b'+Date.now()+'.jpg',a,900);if(b)ap=await up('avatars',S.user.id+'/ac_a'+Date.now()+'.jpg',b,1000);
   const row={book_title:t,book_cover:bc||null,badge:V('#ac_bd')||'বেস্টসেলার',author_name:n,author_photo:ap||null,role:V('#ac_rl'),bio:V('#ac_bio'),notable:V('#ac_nt'),book_link:V('#ac_lk')||null,book_id:S._acBid||null,sort:+V('#ac_so')||0};

 async ac_tog(id){try{const x=await q(sb.from('author_contrib').select('active').eq('id',id).single());await q(sb.from('author_contrib').update({active:!x.active}).eq('id',id));render()}catch(e){E(e)}},
 async ac_del(id){if(!await ask('এই বই ও লেখকের প্রোফাইল মুছে ফেলবেন?','মুছুন'))return;try{await q(sb.from('author_contrib').delete().eq('id',id));render()}catch(e){E(e)}}
});

/* ---- অ্যাডমিন বোতাম → আইকন ---- */
const MAP=[[/অনুমোদন/,'✅'],[/বাতিল|রিজেক্ট|প্রত্যাখ্যান/,'❌'],[/ফেরত/,'↩️'],[/বন্ধ/,'⏸'],[/প্রকাশ/,'🚀'],[/মুছ|ডিলিট/,'🗑'],[/সম্পাদনা|এডিট/,'✏️'],[/পড়ুন|দেখুন|খুলুন/,'👁'],[/গোপন|লুকান/,'🔒'],[/চালু/,'🔓'],[/সেভ|সংরক্ষণ/,'💾'],[/যোগ/,'➕'],[/পাঠান/,'📨'],[/ব্যান/,'🚫']];
const emo=/^\p{Extended_Pictographic}/u;let busy=0;
function iconify(){if(!S.admin||S.view!=='admin'||busy)return;busy=1;
 document.querySelectorAll('#app main .btn:not(.w):not([data-ic])').forEach(b=>{b.dataset.ic=1;const t=b.textContent.trim();if(!t||b.children.length||t.length>34||emo.test(t))return;const m=MAP.find(x=>x[0].test(t));if(!m)return;b.title=t;b.setAttribute('aria-label',t);b.classList.add('ico');b.innerHTML=`<span class="aic">${m[1]}</span><small>${esc(t.length>12?t.slice(0,11)+'…':t)}</small>`});busy=0}
let tm;new MutationObserver(()=>{clearTimeout(tm);tm=setTimeout(iconify,60)}).observe(document.getElementById('app'),{childList:true,subtree:true});
})();

<script id="mb-step5">
/* MAMAR BOI ধাপ ৫: সব অনুমতি-ধরনের বোতাম আইকন-ভিত্তিক */
(()=>{
const BY={subdec:{selected:'✅',rejected:'❌'},ord:{approved:'✅',rejected:'❌'},bmact:{approve:'✅',revision:'↩️',reject:'❌',save:'💾',draft:'📝'},xmact:{approve:'✅',revision:'↩️',reject:'❌',revoke:'⏸'}};
const TX=[[/অনুমোদিত সেভ/,'✅'],[/খসড়া সেভ/,'💾'],[/সেভ|সংরক্ষণ/,'💾'],[/সরান|মুছ/,'🗑'],[/প্রিভিউ/,'👁'],[/সমাধান/,'🛠'],[/ইম্পোর্ট/,'📥']];
const emo=/^\p{Extended_Pictographic}/u,lab=t=>t.replace(/^[^\p{L}\p{N}]+/u,'').trim();
function tile(b,ic,t){t=t.trim();const l=lab(t);b.dataset.ic2=1;b.title=t;b.setAttribute('aria-label',t);b.classList.add('ico2');b.innerHTML=`<span class="aic">${ic}</span><small>${esc(l.length>14?l.slice(0,13)+'…':l)}</small>`}
function run(){if(!S.admin)return;
 document.querySelectorAll('button[data-a]:not([data-ic2])').forEach(b=>{if(b.children.length||b.classList.contains('ico'))return;
  const a=b.dataset.a.split(':'),m=BY[a[0]],k=a[a.length-1],t=b.textContent.trim();
  if(m&&m[k]){tile(b,m[k],t);return}
  b.dataset.ic2=1;
  if(!b.classList.contains('btn')||b.classList.contains('w')||!t||t.length>34||emo.test(t))return;
  if(!(b.closest('#modal')||(S.view==='admin'&&b.closest('main'))))return;
  const x=TX.find(r=>r[0].test(t));if(x)tile(b,x[1],t)});}
let tm;new MutationObserver(()=>{clearTimeout(tm);tm=setTimeout(run,60)}).observe(document.body,{childList:true,subtree:true});
})();
</script>

<script id="mb-step7">

(()=>{

 const row={user_id:S.user.id,name:v('aa_n'),pen_name:v('aa_pn'),age:en(v('aa_a')),district:v('aa_d'),profession:v('aa_pr'),email:v('aa_e'),phone:en(v('aa_ph')),social:v('aa_s'),bio:v('aa_b'),genres:v('aa_g'),experience:v('aa_x'),sample_link:v('aa_sl')};
 if(!row.name||!row.age||!row.district||!row.profession||!row.email||!row.phone||!row.bio)return er('* চিহ্নিত সব তথ্য দিন');
 if(!/^\d{1,3}$/.test(row.age))return er('বয়স সংখ্যায় লিখুন (যেমন ২২)');
 const b=document.querySelector('[data-a="aa_send"]');if(b)b.disabled=true;
 try{const ex=await q(sb.from('author_profiles').select('user_id').eq('user_id',S.user.id).maybeSingle());
  await q(ex?sb.from('author_profiles').update(row).eq('user_id',S.user.id):sb.from('author_profiles').insert(row));
  await q(sb.from('author_applications').upsert({user_id:S.user.id,status:'pending',updated_at:now()},{onConflict:'user_id'}));
  S.appSt='pending';toast('✅ আবেদন জমা হয়েছে, অ্যাডমিন যাচাই করবেন');render()}
 catch(e){er('আবেদন জমা হয়নি: '+(e.message||e));if(b)b.disabled=false}};
/* ---- অ্যাডমিন: সব আবেদনকারী (নতুন ও পুরনো) ---- */
window.adminAuthAppsH=async()=>{const L=await load();await apCount();const o={pending:0,approved:1,rejected:2};L.sort((a,b)=>o[a.st]-o[b.st]);
 const n=s=>L.filter(x=>x.st===s).length;
 return `<div class="gl"><h3>🧑‍🎓 লেখকের আবেদন</h3><p class="mu" style="font-size:.85rem">অপেক্ষমাণ ${bn(n('pending'))} • অনুমোদিত ${bn(n('approved'))} • বাতিল ${bn(n('rejected'))}<br>অনুমোদন দিলে শুধু ওই অ্যাকাউন্টে লেখক স্টুডিও ও যৌথ বই চালু হবে।</p></div>`+(L.length?L.map(({p,st})=>`<div class="gl"><b>${esc(p.name||'—')}</b>${p.pen_name?` (${esc(p.pen_name)})`:''} <span class="st ${st==='approved'?'approved':st==='rejected'?'rejected':'pending'}">${SL[st]}</span><br><small class="mu">বয়স ${esc(p.age)} • ${esc(p.district)} • ${esc(p.profession)}<br>ফোন ${esc(p.phone)} • ${esc(p.email)}${p.social?`<br>${esc(p.social)}`:''}<br>ধারা: ${esc(p.genres||'—')} • অভিজ্ঞতা: ${esc(p.experience||'—')}${p.sample_link?`<br><a href="${esc(p.sample_link)}" target="_blank" rel="noopener">নমুনা লেখা</a>`:''}</small><p style="white-space:pre-wrap;font-size:.88rem">${esc(p.bio||'')}</p><div style="display:flex;gap:6px;flex-wrap:wrap">${st!=='approved'?`<button class="btn sm ok" data-a="aa_ok:${p.user_id}">✅ অনুমোদন</button>`:`<button class="btn sm gh" data-a="aa_rev:${p.user_id}">🚫 অনুমতি বন্ধ</button>`}${st==='pending'?`<button class="btn sm dng" data-a="aa_no:${p.user_id}">❌ বাতিল</button>`:''}</div></div>`).join(''):'<div class="gl"><p class="mu">এখনো কোনো আবেদন আসেনি</p></div>')};
const up=(u,st)=>q(sb.from('author_applications').upsert({user_id:u,status:st,updated_at:now()},{onConflict:'user_id'}));
Object.assign(A,{
 async aa_ok(u){try{await q(sb.from('user_roles').upsert({user_id:u,role:'author'},{onConflict:'user_id,role'}));await up(u,'approved');pushNotification({title:'আপনি এখন অনুমোদিত লেখক',message:'আপনার প্রোফাইলে লেখক স্টুডিও ও যৌথ বই চালু হয়েছে।',target:'user',target_user_id:u});toast('অনুমোদিত হয়েছে');await apCount();render()}catch(e){E(e)}},
 async aa_no(u){try{await up(u,'rejected');pushNotification({title:'লেখকের আবেদন গৃহীত হয়নি',message:'তথ্য ঠিক করে আবার আবেদন করতে পারেন।',target:'user',target_user_id:u});await apCount();render()}catch(e){E(e)}},
 async aa_rev(u){if(!await ask('এই অ্যাকাউন্টের লেখক অনুমতি বন্ধ করবেন?','বন্ধ করুন'))return;try{await q(sb.from('user_roles').delete().eq('user_id',u).eq('role','author'));await up(u,'rejected');await apCount();render()}catch(e){E(e)}}
});
/* ---- অ্যাডমিনের জন্য সঙ্গে সঙ্গে জানানো + ব্যাজ ---- */
function live(){if(S._apl)return;S._apl=1;
 sb.channel('apl').on('postgres_changes',{event:'*',schema:'public',table:'author_applications'},async p=>{await apCount();if(p.eventType==='INSERT'||(p.new&&p.new.status==='pending'))toast('🧑‍🎓 নতুন লেখকের আবেদন এসেছে!');render()})
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'author_profiles'},async()=>{await apCount();toast('🧑‍🎓 নতুন লেখকের আবেদন এসেছে!');render()}).subscribe()}
let n=0;const t=setInterval(()=>{if(S.admin){clearInterval(t);apCount().then(()=>{live();render()})}else if(++n>25)clearInterval(t)},1500);
})();
